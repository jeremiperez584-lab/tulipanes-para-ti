<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un jardín para ti 🌷</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FONDO -->
    <div class="space">

        <div class="stars"></div>

        <!-- PLANETA -->
        <div class="planet">
            <div class="planet-glow"></div>
            <div class="planet-surface"></div>
            <div class="planet-ring"></div>
        </div>

        <!-- LUNA -->
        <div class="moon"></div>

        <!-- TEXTO -->
        <div class="message">
            <h1>Para ti 🌷</h1>
            <p>
                Hice este pequeño jardín pensando en ti.
                <br>
                Que cada flor represente un sentimiento
                que llevo dentro de mi corazón.
            </p>
        </div>

        <!-- JARDÍN -->
        <div class="garden">

            <!-- TULIPÁN 1 -->
            <div class="tulip tulip1">
                <div class="flower">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

            <!-- TULIPÁN 2 -->
            <div class="tulip tulip2">
                <div class="flower">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

            <!-- TULIPÁN 3 -->
            <div class="tulip tulip3">
                <div class="flower">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

            <!-- TULIPÁN 4 -->
            <div class="tulip tulip4">
                <div class="flower">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

            <!-- TULIPÁN 5 -->
            <div class="tulip tulip5">
                <div class="flower">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

        </div>

        <!-- BOTÓN -->
        <button id="magicButton">
            ✨ Toca aquí ✨
        </button>

        <!-- MENSAJE OCULTO -->
        <div id="secretMessage">
            <h2>🌷 Para alguien especial 🌷</h2>
            <p>
                Entre millones de estrellas y planetas,
                siempre hay un lugar donde florecen
                los sentimientos más bonitos.
            </p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
